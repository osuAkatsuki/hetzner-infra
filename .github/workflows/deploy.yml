name: Deploy infrastructure config

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy configs to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /opt/akatsuki/hetzner-infra
            git fetch origin main
            git checkout -f -B main origin/main
            git clean -fd

            # Apply config changes
            install -D -m 0644 config/apt/apt.conf.d/99-akatsuki-periodic-upgrades /etc/apt/apt.conf.d/99-akatsuki-periodic-upgrades
            test "$(apt-config shell UPDATE_PACKAGE_LISTS APT::Periodic::Update-Package-Lists)" = "UPDATE_PACKAGE_LISTS='0'"
            test "$(apt-config shell UNATTENDED_UPGRADE APT::Periodic::Unattended-Upgrade)" = "UNATTENDED_UPGRADE='0'"
            mkdir -p /etc/systemd/journald.conf.d
            cp config/systemd/journald.conf.d/akatsuki.conf /etc/systemd/journald.conf.d/akatsuki.conf
            systemctl restart systemd-journald
            journalctl --vacuum-size=1G
            cp config/docker-compose.yml /opt/akatsuki/docker-compose.yml
            cp config/mysql/99-akatsuki.cnf /etc/mysql/mysql.conf.d/99-akatsuki.cnf
            # Ensure default mysqld.cnf doesn't override our bind-address
            sed -i 's/^bind-address\s*=\s*127.0.0.1/bind-address = 0.0.0.0/' /etc/mysql/mysql.conf.d/mysqld.cnf
            cp config/cron/akatsuki /etc/cron.d/akatsuki
            chmod 644 /etc/cron.d/akatsuki
            cmp config/cron/akatsuki /etc/cron.d/akatsuki
            cp config/vault/config.hcl /etc/vault.d/vault.hcl
            cp config/nginx/nginx.conf /etc/nginx/nginx.conf
            cp config/nginx/robots.txt /etc/nginx/robots.txt
            # Mirror the directory so sites removed from the repo are removed from the host
            rsync -a --delete config/nginx/sites-enabled/ /etc/nginx/sites-enabled/

            # Validate and reload nginx
            nginx -t
            systemctl reload nginx

            # Apply firewall rules, and re-apply them at boot
            bash scripts/apply-firewall.sh
            install -m 0644 systemd/akatsuki-firewall.service /etc/systemd/system/akatsuki-firewall.service
            systemctl daemon-reload
            systemctl enable akatsuki-firewall.service

            # Restart data services only if their configs changed. Redis is copied and restarted in
            # one step so a deploy that fails in between can't leave a new config on disk unapplied.
            if ! cmp -s config/redis/redis.conf /etc/redis/redis.conf; then
              cp config/redis/redis.conf /etc/redis/redis.conf
              systemctl restart redis-server
            fi
            # MySQL and Vault require manual restart for safety

            # Apply docker-compose.yml: recreates containers whose config changed and starts any
            # that are stopped. Cron services are profile-gated and stay off. This doesn't pull
            # images; each app's own deploy pulls its image.
            docker compose -f /opt/akatsuki/docker-compose.yml up -d

            # Compose doesn't track the contents of mounted config files (e.g. prometheus.yml), so
            # restart any container whose mounted repo config changed after the container started.
            for name in $(docker compose -f /opt/akatsuki/docker-compose.yml ps --format '{{.Name}}'); do
              started=$(docker inspect -f '{{.State.StartedAt}}' "$name")
              for src in $(docker inspect -f '{{range .Mounts}}{{if eq .Type "bind"}}{{.Source}} {{end}}{{end}}' "$name"); do
                if [[ $src == /opt/akatsuki/config/* ]] && [ -n "$(find "$src" -newermt "$started" -print -quit)" ]; then
                  docker restart "$name"
                  break
                fi
              done
            done
