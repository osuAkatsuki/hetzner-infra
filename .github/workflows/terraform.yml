name: Terraform

on:
  push:
    branches: [main]
    paths: [tf/**]
  pull_request:
    branches: [main]
    paths: [tf/**, .github/workflows/terraform.yml]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-validate:
    name: Terraform Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tf

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  terraform-deploy:
    name: Terraform Plan and Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.WASABI_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.WASABI_SECRET_KEY }}
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Keep production addresses out of public workflow logs.
      - name: Hide Server Addresses
        run: |
          set -euo pipefail
          addresses=$(curl -sf -H "Authorization: Bearer $TF_VAR_hcloud_token" https://api.hetzner.cloud/v1/servers \
            | jq -r '.servers[].public_net | .ipv4.ip, (.ipv6.ip | split("::")[0])')
          test -n "$addresses"
          while IFS= read -r address; do
            printf '::add-mask::%s\n' "$address"
          done <<< "$addresses"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./tf
        run: terraform init -input=false

      - name: Terraform Format
        working-directory: ./tf
        run: terraform fmt -check

      - name: Terraform Plan
        id: tf-plan
        working-directory: ./tf
        run: |
          exitcode=0
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -detailed-exitcode \
            -no-color \
            -out="$RUNNER_TEMP/terraform.tfplan" \
            || exitcode=$?

          case "$exitcode" in
            0|2) echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT" ;;
            *) exit "$exitcode" ;;
          esac

      # Keep the plan on this runner because a saved plan contains sensitive values.
      - name: Terraform Apply
        if: steps.tf-plan.outputs.exitcode == '2'
        working-directory: ./tf
        run: terraform apply -input=false -lock-timeout=5m "$RUNNER_TEMP/terraform.tfplan"
