server {
    listen 80;
    server_name assets.akatsuki.gg;

    location / {
        return 302 $scheme://assets.ppy.sh$request_uri;
    }
}

server {
    listen 80;
    server_name b.akatsuki.gg;

    location / {
        return 302 $scheme://b.ppy.sh$request_uri;
    }
}

server {
    listen 80;
    server_name s.akatsuki.gg;

    location / {
        return 302 $scheme://s.ppy.sh$request_uri;
    }
}

server {
    listen 80;
    server_name www.akatsuki.gg;

    location / {
        return 301 https://akatsuki.gg$request_uri;
    }
}
