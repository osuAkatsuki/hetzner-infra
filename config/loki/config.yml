auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
  aws:
    endpoint: "s3.ca-central-1.wasabisys.com"
    region: "ca-central-1"
    bucketnames: "akatsuki.pw"
    access_key_id: "${WASABI_ACCESS_KEY}"
    secret_access_key: "${WASABI_SECRET_KEY}"
    s3forcepathstyle: true

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 100

schema_config:
  configs:
    # This period's prefix contains slashes, which the compactor can't parse as a table name
    # (it sees one table called "observability"), so its tables are never compacted and retention
    # never deletes their logs. Later periods use a prefix without slashes.
    - from: "2024-01-01"
      store: tsdb
      object_store: aws
      schema: v13
      index:
        prefix: observability/loki/index_
        period: 24h
    - from: "2026-11-01"
      store: tsdb
      object_store: aws
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

limits_config:
  max_query_length: 0
  retention_period: 8760h # 1 year
  retention_stream:
    # nginx access logs hold visitors' IP addresses
    - selector: '{job="nginx"}'
      priority: 1
      period: 2160h # 90 days
  # Retention still runs; this only rejects on-demand deletes through /loki/api/v1/delete, which
  # anything that can reach Loki could otherwise use to erase logs
  deletion_mode: disabled

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: aws
